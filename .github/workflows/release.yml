# The release (ADR 0002 in haltia-de/device-lenovo-b8000h): a vX.Y.Z tag
# builds the signed Alpine package and puts it into the GitHub release.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  apk:
    uses: haltia-de/ci/.github/workflows/apk.yml@v1
    with:
      # haltia-vplay is C: a package per architecture.
      arch: armv7 aarch64 x86_64
    secrets: inherit
