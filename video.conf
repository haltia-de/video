# Videos in large cards, played full screen by the shell's b8k-vplay.
# Installed as /usr/local/share/b8k/apps.d/video.conf; b8k-apps adds it to
# the shell's programs (fields: see /usr/local/share/b8k/apps.conf).
[video]
label = Видео
icon = /usr/local/share/b8k/video.svg
app_ids = b8k.Video b8k-video b8k-vplay
exec = b8k-video
