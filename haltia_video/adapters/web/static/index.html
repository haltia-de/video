<!doctype html>
<!-- SPDX-License-Identifier: GPL-2.0 -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e6e6e4">
  <title>Видео</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <header>
    <button id="back" aria-label="Назад">←</button><h1>Видео</h1>
    <button id="fullscreen" aria-label="На весь экран">⛶</button>
    <button id="settings" aria-label="Настройки">⚙</button>
  </header>
  <section id="pair" hidden>
    <h2>Подключение к ПК</h2>
    <p>Включите «Доступ из локальной сети» в настройках «Видео» на ПК и получите код.</p>
    <form id="pair-form">
      <label>Название устройства<input id="device-name" maxlength="80" value="Планшет"></label>
      <label>Код с ПК<input id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="100"></label>
      <button type="submit" class="primary">Подключиться</button>
    </form>
    <p id="pair-note" role="status"></p>
  </section>
  <div id="app" hidden>
    <form id="search-form" class="tools">
      <select id="scope" aria-label="Источник поиска"><option value="all">Все сервисы</option></select>
      <input id="query" type="search" placeholder="Найти видео" aria-label="Поиск" maxlength="256">
      <button type="submit" class="primary">Найти</button>
    </form>
    <nav id="tabs" aria-label="Разделы">
      <button data-page="home">Главная</button><button data-page="feed">Подписки</button>
      <button data-page="channels">Каналы</button><button data-page="bookmarks">Закладки</button>
      <button data-page="history">История</button>
    </nav>
    <main><p id="note" role="status"></p><div id="content"></div></main>
  </div>
  <section id="player" hidden aria-label="Проигрыватель">
    <div class="tools"><strong id="playing-title"></strong><button id="close-player" aria-label="Закрыть проигрыватель">✕</button></div>
    <video id="video" playsinline controls preload="metadata"></video>
    <div class="tools">
      <button id="previous" aria-label="Предыдущее видео">⏮</button>
      <button id="toggle-play" aria-label="Пауза или продолжение">▶</button>
      <input id="timeline" type="range" min="0" max="1" value="0" step="1" aria-label="Позиция просмотра">
      <span id="time">0:00</span><button id="next" aria-label="Следующее видео">⏭</button>
      <select id="quality" aria-label="Качество"><option value="360">до 360p</option><option value="480">до 480p</option><option value="720" selected>до 720p</option><option value="1080">до 1080p</option></select>
    </div>
    <p id="player-note" role="status"></p><a id="service-link" target="_blank" rel="noopener noreferrer">Открыть в сервисе</a>
  </section>
  <div id="modal" hidden role="dialog" aria-modal="true" aria-label="Действие">
    <div id="modal-body"></div>
  </div>
</body>
</html>
